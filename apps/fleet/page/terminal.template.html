<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>fleet terminal</title>
<!--
  Zero-install browser fallback for a studio's terminal (Task 10). The
  NATIVE phone path is Tailscale+Moshi (see cli/fleet.ts for the Mac
  client); this page exists for iPhone Safari when Tailscale isn't set up,
  and for a quick Mac peek without installing the CLI. Deliberately minimal:
  no framework, one file, no build complexity beyond inlining xterm.

  The two blocks below marked XTERM_..._START/END are written by
  scripts/build-page.ts from node_modules/@xterm/xterm (bun run
  build:page) — do not hand-edit between those markers, re-run the build
  script instead. Everything else in this file is hand-authored and is the
  actual source of truth; scripts/build-page.ts only ever touches the two
  marked spans.
-->
<style>
/*XTERM_CSS_START*/
/*XTERM_CSS_END*/
</style>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    /* iOS Safari: 100vh includes the address bar's own height and then
       hides it, leaving a scrollable gap; 100dvh tracks the visible
       viewport instead. */
    height: 100dvh;
    background: #0b0b0c;
    overflow: hidden;
    /* Kills the ~300ms double-tap-to-zoom delay across the whole page
       (buttons included) without disabling pinch-zoom outright. */
    touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #status {
    flex: 0 0 auto;
    display: none;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.4;
    color: #ffce7a;
    background: #241a08;
    border-bottom: 1px solid #40300f;
  }
  #status.show { display: block; }
  #t {
    flex: 1 1 auto;
    min-height: 0;
    padding: 4px 4px 0;
  }
  #keys {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: #17181b;
    border-top: 1px solid #2a2b2f;
  }
  #keys button {
    touch-action: manipulation;
    flex: 1 1 0;
    padding: 12px 4px;
    font-size: 14px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color: #e6e6e6;
    background: #26272b;
    border: 1px solid #34353a;
    border-radius: 8px;
    -webkit-user-select: none;
    user-select: none;
  }
  #keys button:active,
  #keys button.pressed {
    background: #3a6df0;
    border-color: #3a6df0;
    color: #fff;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="status"></div>
  <div id="t"></div>
  <div id="keys">
    <button type="button" data-key="esc">esc</button>
    <button type="button" data-key="tab">tab</button>
    <button type="button" data-key="ctrl" id="ctrlBtn">ctrl</button>
    <button type="button" data-key="up">&uarr;</button>
    <button type="button" data-key="down">&darr;</button>
    <button type="button" data-key="ctrl-b">^b</button>
  </div>
</div>
<script>
/*XTERM_JS_START*/
/*XTERM_JS_END*/
</script>
<script>
"use strict";
(function () {
  // The studio id this page was served for — routes.ts (src/studio/page.ts)
  // substitutes the quoted placeholder below with the real id before
  // sending the response. The build artifact itself (page/terminal.html)
  // is studio-id-agnostic; this is the one per-request piece.
  var STUDIO_ID = "__FLEET_STUDIO_ID__";

  // ---------------------------------------------------------------------
  // Reconnect backoff — mirrors cli/backoff.ts's reconnectDelayMs exactly
  // (the Mac client's own reconnect logic for this same WS): exponential
  // doubling from a 500ms base, capped at 10s BEFORE jitter, then a
  // [0,+25%] jitter on top so a capped attempt can land up to 12.5s but
  // never below the exponential value itself. Hand-copied rather than
  // imported: this page ships as one static file with no bundler for its
  // own script, unlike cli/fleet.ts.
  var BACKOFF_BASE_MS = 500;
  var BACKOFF_CAP_MS = 10000;
  var BACKOFF_JITTER_MAX = 0.25;
  function reconnectDelayMs(attempt) {
    var doublings = Math.max(0, attempt - 1);
    var exp = Math.min(BACKOFF_BASE_MS * Math.pow(2, doublings), BACKOFF_CAP_MS);
    return exp * (1 + Math.random() * BACKOFF_JITTER_MAX);
  }

  // Mirrors src/studio/frames.ts's encodeResize exactly — same JSON shape
  // the server's parseFrame expects on a text frame.
  function encodeResize(cols, rows) {
    return JSON.stringify({ t: "resize", cols: cols, rows: rows });
  }

  // Same-origin WS: the browser carries the Access cookie on the upgrade
  // automatically, so there is no token UI here at all.
  function wsUrl() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + location.host + "/studio/" + encodeURIComponent(STUDIO_ID) + "/ws/terminal";
  }

  var statusEl = document.getElementById("status");
  function setStatus(msg) {
    if (!msg) {
      statusEl.className = "";
      statusEl.textContent = "";
      return;
    }
    statusEl.className = "show";
    statusEl.textContent = msg;
  }

  // ---------------------------------------------------------------------
  // Terminal setup. No addon-fit in the base package's dist (checked at
  // build time — see scripts/build-page.ts's header), so cols/rows are
  // computed from measured character metrics instead of a fit addon.
  var FONT_FAMILY = "ui-monospace, Menlo, Consolas, monospace";
  var FONT_SIZE = 14;
  var LINE_HEIGHT = 1.2;

  var term = new Terminal({
    cursorBlink: true,
    fontFamily: FONT_FAMILY,
    fontSize: FONT_SIZE,
    lineHeight: LINE_HEIGHT,
    theme: { background: "#0b0b0c" },
  });
  var termEl = document.getElementById("t");
  term.open(termEl);

  var measureCtx = document.createElement("canvas").getContext("2d");
  function cellMetrics() {
    measureCtx.font = FONT_SIZE + "px " + FONT_FAMILY;
    return {
      width: measureCtx.measureText("W").width,
      height: Math.ceil(FONT_SIZE * LINE_HEIGHT),
    };
  }
  function fit() {
    var cell = cellMetrics();
    var cols = Math.max(2, Math.floor(termEl.clientWidth / cell.width));
    var rows = Math.max(1, Math.floor(termEl.clientHeight / cell.height));
    term.resize(cols, rows);
  }
  fit(); // size correctly even before the first connection opens
  term.focus();

  // ---------------------------------------------------------------------
  // ctrl sticky modifier: tap ctrl, then tap a single letter key (real
  // keyboard or the iOS virtual one) — that keystroke is turned into the
  // matching control byte instead of being sent literally, then the
  // modifier releases. "tap ctrl then c sends 0x03" is this path.
  var ctrlActive = false;
  var ctrlBtn = document.getElementById("ctrlBtn");
  function setCtrlActive(v) {
    ctrlActive = v;
    ctrlBtn.classList.toggle("pressed", v);
  }
  // charCode & 0x1f is the standard Ctrl-<letter> control-code formation —
  // 'a'-'z' and 'A'-'Z' both collapse to the same 0x01-0x1a range, so case
  // doesn't matter. ctrl-c -> 0x03, ctrl-b -> 0x02 (matching the dedicated
  // ctrl-b button below).
  function ctrlify(ch) {
    return ch.toUpperCase().charCodeAt(0) & 0x1f;
  }

  // ---------------------------------------------------------------------
  // WS wiring. Binary both ways: server output arrives as ArrayBuffer
  // (binaryType set below) and is written straight to xterm; keystrokes and
  // button-injected bytes always go out as a binary frame too — a text
  // frame is reserved for the resize control message (frames.ts's
  // parseFrame only recognizes {t:"resize",...} on a text frame and
  // otherwise ignores it, so terminal input must never be sent as text).
  var ws = null;
  var attempt = 0;
  var openedAt = null; // set on "open"; reconnect floor-loop reads it below
  var reconnectTimer = null;

  function send(bytes) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(bytes);
  }
  function sendResize() {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(encodeResize(term.cols, term.rows));
  }

  term.onData(function (data) {
    if (ctrlActive) {
      setCtrlActive(false); // one-shot regardless of what was typed
      if (data.length === 1 && /[a-zA-Z]/.test(data)) {
        send(new Uint8Array([ctrlify(data)]));
        return;
      }
    }
    send(new TextEncoder().encode(data));
  });

  function connect() {
    setStatus(attempt === 0 ? "connecting…" : "reconnecting… (attempt " + attempt + ")");
    var socket = new WebSocket(wsUrl());
    socket.binaryType = "arraybuffer";
    ws = socket;
    openedAt = null;

    socket.addEventListener("open", function () {
      openedAt = Date.now();
      setStatus("");
      fit(); // re-fit + resend size on reconnect
      sendResize();
    });
    socket.addEventListener("message", function (ev) {
      if (typeof ev.data === "string") return; // server never sends text frames (frames.ts contract)
      term.write(new Uint8Array(ev.data));
    });
    socket.addEventListener("close", function () {
      if (ws === socket) ws = null;
      scheduleReconnect();
    });
    // "close" always follows "error" for a WebSocket that failed to open or
    // dropped abnormally, so reconnect scheduling lives only in the "close"
    // handler above — one path, not two racing ones.
    socket.addEventListener("error", function () {});
  }

  // Reconnect floor-loop (P1 T10 ledger / P2 ride-along) — mirrors
  // cli/backoff.ts's nextAttempt exactly: a connection that closes within 5s
  // of opening must NOT reset the backoff counter, or an open-then-1011
  // studio gets hammered every ~500ms forever instead of backing off. Hand-
  // copied rather than imported, same reason reconnectDelayMs above is.
  function nextAttempt(prevAttempt, connLifetimeMs) {
    return connLifetimeMs >= 5000 ? 0 : prevAttempt;
  }

  function scheduleReconnect() {
    var lifetimeMs = openedAt === null ? 0 : Date.now() - openedAt;
    attempt = nextAttempt(attempt, lifetimeMs) + 1;
    var delay = reconnectDelayMs(attempt);
    setStatus("disconnected — retrying in " + Math.round(delay / 1000) + "s (attempt " + attempt + ")");
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, delay);
  }

  // ---------------------------------------------------------------------
  // On-screen key row: fixed bytes for esc/tab/up/down/ctrl-b; ctrl toggles
  // the sticky modifier above instead of sending anything itself.
  var KEY_BYTES = {
    esc: [0x1b],
    tab: [0x09],
    up: [0x1b, 0x5b, 0x41],
    down: [0x1b, 0x5b, 0x42],
    "ctrl-b": [0x02],
  };
  document.getElementById("keys").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-key]");
    if (!btn) return;
    var key = btn.getAttribute("data-key");
    if (key === "ctrl") {
      setCtrlActive(!ctrlActive);
      return;
    }
    // One-shot, same as the keyboard path in term.onData above: ANY other
    // button press releases the sticky modifier too, not just a typed key.
    // Without this, "tap ctrl, tap ↑" left ctrlActive armed (only
    // term.onData ever cleared it), so the next real keystroke got
    // ctrl-ified even though the user never asked for that.
    if (ctrlActive) setCtrlActive(false);
    var bytes = KEY_BYTES[key];
    if (bytes) send(new Uint8Array(bytes));
  });

  // ---------------------------------------------------------------------
  // Re-fit on viewport change (rotation, iOS Safari's address bar show/hide
  // which resizes the dvh viewport without a page reload). Debounced so a
  // drawn-out rotation animation doesn't fire a resize frame per tick.
  var resizeTimer = null;
  function onViewportResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      fit();
      sendResize();
    }, 100);
  }
  window.addEventListener("resize", onViewportResize);
  window.addEventListener("orientationchange", onViewportResize);

  connect();
})();
</script>
</body>
</html>
